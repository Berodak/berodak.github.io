name: Bero-Trade signaux

on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signaux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bero-trade/notify.js
        env:
          NTFY_TOPIC: bero-trade-c4d2d63df1
